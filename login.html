<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FoodExpress - Login</title>

    <link rel="stylesheet" href="user.css">

</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <div class="login-logo">
                🍔 FoodExpress
            </div>


            <h1>
                Welcome Back!
            </h1>


            <p class="login-subtitle">
                Login to order your favourite food
            </p>


            <!-- LOGIN FORM -->

            <form id="loginForm">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <p
                id="loginError"
                class="login-error"
            ></p>


            <!-- SIGN UP -->

            <div class="login-bottom">

                <p>
                    Don't have an account?

                    <a
                        href="#"
                        onclick="showSignup(); return false;"
                    >
                        Sign Up
                    </a>

                </p>

            </div>


            <div
                id="signupBox"
                class="signup-box"
            >

                <h2>
                    Create Account
                </h2>


                <input
                    type="text"
                    id="signupUsername"
                    placeholder="Create username"
                >


                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create password"
                >


                <button
                    onclick="signup()"
                    class="signup-button"
                >
                    Create Account
                </button>


                <p
                    id="signupMessage"
                    class="signup-message"
                ></p>

            </div>


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Home
            </a>

        </div>

    </div>


    <script src="user.js"></script>

</body>

</html>
